<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awa - Forgot Password</title>
  <meta name="color-scheme" content="light" />
  <link rel="stylesheet" href="styles/typography.css" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #122033;
      --muted: rgba(18, 32, 51, 0.68);
      --line: rgba(18, 32, 51, 0.12);
      --accent: #1f66ff;
      --accent-deep: #174fd1;
      --success: #0b8f5a;
      --danger: #c0392b;
      --shadow: 0 18px 60px rgba(25, 40, 70, 0.12);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      font-family: var(--font-body);
      background: var(--bg);
    }

    a { color: inherit; }

    .shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 16px;
    }

    .page {
      width: min(100%, 420px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      font-size: 0.95rem;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent-deep);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      font-size: clamp(2.2rem, 7vw, 3rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      margin-bottom: 12px;
    }

    .lead {
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.5;
    }

    .status {
      display: none;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid transparent;
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .status[data-visible="true"] { display: block; }

    .status--error {
      color: var(--danger);
      background: rgba(192, 57, 43, 0.08);
      border-color: rgba(192, 57, 43, 0.16);
    }

    .status--success {
      color: var(--success);
      background: rgba(11, 143, 90, 0.09);
      border-color: rgba(11, 143, 90, 0.16);
    }

    .form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 1rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 14px 15px;
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    input:focus {
      border-color: rgba(31, 102, 255, 0.42);
      box-shadow: 0 0 0 4px rgba(31, 102, 255, 0.1);
    }

    .helper {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 6px;
    }

    .button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .button--primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      box-shadow: 0 10px 20px rgba(31, 102, 255, 0.18);
    }

    .button--primary:hover:not(:disabled),
    .button--primary:focus-visible:not(:disabled) {
      transform: translateY(-1px);
    }

    .footer-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .hidden { display: none !important; }

    @media (max-width: 520px) {
      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="page" aria-label="Forgot password page">
      <div class="brand" aria-label="Awa">
        <span class="brand-mark">a</span>
        <span>Awa</span>
      </div>

      <p class="eyebrow">Forgot password</p>
      <h1>Reset password</h1>
      <p class="lead">Enter your email and we’ll send a reset link if an account exists.</p>

      <div class="status" id="status" role="status" aria-live="polite"></div>

      <form class="form" id="forgotForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required placeholder="alice@test.com" />
          <div class="helper">Use the email address connected to your Awa account.</div>
        </div>

        <div class="actions">
          <button class="button button--primary" id="submitButton" type="submit">Send reset email</button>
        </div>

        <p class="footer-note" id="footerNote">
          If an account exists for that email address, password reset instructions will be sent.
        </p>
      </form>
    </section>
  </main>

  <script>
    (function () {
      const config = window.AWA_AUTH_PAGES_CONFIG || window.AWA_PASSWORD_RESET_CONFIG || {};
      const apiBaseUrl = config.apiBaseUrl || "";
      const forgotPasswordPath = config.forgotPasswordPath || "/api/auth/forgot-password";
      const endpoint = new URL(forgotPasswordPath, apiBaseUrl || window.location.origin).toString();
      const form = document.getElementById("forgotForm");
      const status = document.getElementById("status");
      const emailInput = document.getElementById("email");
      const submitButton = document.getElementById("submitButton");
      const footerNote = document.getElementById("footerNote");

      const successMessage = "If an account exists for that email address, password reset instructions have been sent.";

      function setFormEnabled(enabled) {
        emailInput.disabled = !enabled;
        submitButton.disabled = !enabled;
      }

      function showStatus(message, type) {
        status.textContent = message;
        status.className = "status status--" + type;
        status.dataset.visible = "true";
      }

      function clearStatus() {
        status.dataset.visible = "false";
        status.textContent = "";
        status.className = "status";
      }

      function validateEmail(email) {
        if (!email) {
          return "Enter your email address.";
        }

        if (!/^\S+@\S+\.\S+$/.test(email)) {
          return "Enter a valid email address.";
        }

        return "";
      }

      async function submitForgotPassword(event) {
        event.preventDefault();

        const email = emailInput.value.trim();
        const validationMessage = validateEmail(email);

        if (validationMessage) {
          showStatus(validationMessage, "error");
          return;
        }

        setFormEnabled(false);
        submitButton.textContent = "Sending...";
        clearStatus();

        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({ email: email }),
          });

          const contentType = response.headers.get("content-type") || "";
          const payload = contentType.includes("application/json") ? await response.json().catch(() => null) : null;

          if (!response.ok) {
            showStatus(payload?.message || payload?.error || mapErrorMessage(response.status), "error");
            setFormEnabled(true);
            submitButton.textContent = "Send reset email";
            return;
          }

          showStatus(payload?.message || successMessage, "success");
          footerNote.textContent = successMessage;
          submitButton.textContent = "Send another email";
          emailInput.value = "";
          emailInput.focus();
          setFormEnabled(true);
        } catch (error) {
          showStatus("We could not reach the server. Check your connection and try again.", "error");
          setFormEnabled(true);
          submitButton.textContent = "Send reset email";
        }
      }

      function mapErrorMessage(statusCode) {
        switch (statusCode) {
          case 400:
            return "Please check the email address and try again.";
          case 429:
            return "Too many requests were made. Please wait a moment and try again.";
          default:
            return "We could not send the reset email right now. Please try again.";
        }
      }

      emailInput.addEventListener("input", function () {
        if (status.dataset.visible === "true" && status.classList.contains("status--error")) {
          clearStatus();
        }
      });

      form.addEventListener("submit", submitForgotPassword);
      setFormEnabled(true);
    })();
  </script>
</body>
</html>
